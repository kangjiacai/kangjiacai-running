name: Deploy to EdgeOne Makers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edgeone-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Package static site
        working-directory: dist/client
        run: zip -r ../marathon-430-edgeone.zip .

      - name: Deploy to EdgeOne Makers
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: >-
          npx edgeone@latest makers deploy
          ./dist/marathon-430-edgeone.zip
          -n hefei-marathon-430-auto
          -t "$EDGEONE_API_TOKEN"
          -e production
